<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AuctionAfto — Продажа авто с торгов</title>
  <meta name="description" content="Ежедневно пополняем список авто с торгов и выкупаем их для клиентов. Без аккредитации и лишней бюрократии — всё сделаем за вас." />
  <meta name="theme-color" content="#070b14" />
  <meta property="og:title" content="AuctionAfto — авто с торгов" />
  <meta property="og:description" content="Консультации, обучение и выкуп авто с торгов под ключ." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:url" content="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body>
  <div class="page-decor decor-1" aria-hidden="true"></div>
  <div class="page-decor decor-2" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="logo" aria-label="AuctionAfto">
        <span class="logo-type">AuctionA<span class="brand-f">f</span>to</span>
      </a>
      <a class="btn pill ghost tg-cta" href="https://t.me/auctionafto" target="_blank" rel="noopener" aria-label="Написать в Telegram">
        <span class="i i-tg" aria-hidden="true"></span>
      </a>
    </div>
  </header>

  <main id="top">
<!-- ===== HERO v2 (BEGIN) ===== -->
<section id="hero" class="hero2">
  <div class="hero2-container">
    <div class="hero2-grid">
      <!-- ЛЕВАЯ КОЛОНКА -->
      <div class="hero2-col">
        <h1 class="hero2-title hero2-title--violet">Обучение</h1>
        <p class="hero2-text">
          Разбираем рынок торгов, процедуры выкупа и
          практические кейсы — от первых шагов до заработка
          на услугах и сделках.
        </p>

        <figure class="hero2-figure">
          <img src="assets/img/auction.jpg" alt="Аукционный молоток — обучение работе с торгами" loading="lazy">
        </figure>

        <a href="/training.html" class="hero2-btn hero2-btn--primary">
          Программа обучения
          <span class="hero2-arrow" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 5l7 7-7 7M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </div>

    </div>
  </div>
</section>
<!-- ===== HERO v2 (END) ===== -->


  </main>

  <script>
    // Плавное появление секций
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    },{threshold:0.15});
    document.querySelectorAll('.section').forEach(el=>io.observe(el));
  </script>
</body>
</html>
